spring:
  application:
    name: springboot4ddd-test
  sql:
    init:
      mode: never
  user:
    datasource:
      jdbc-url: jdbc:h2:mem:users;MODE=MySQL;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password: ''
      minimum-idle: 0
      maximum-pool-size: 2
      pool-name: UserTestPool
    fallback:
      enabled: false
  order:
    datasource:
      jdbc-url: jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password: ''
      minimum-idle: 0
      maximum-pool-size: 2
      pool-name: OrderTestPool
    fallback:
      enabled: false

logging:
  level:
    root: WARN
    com.hanserwei.springboot4ddd: INFO
